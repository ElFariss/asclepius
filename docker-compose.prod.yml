services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asclepius}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-asclepius}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - asclepius-postgres-prod:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-asclepius}?sslmode=disable
      CORS_ORIGIN: ${APP_ORIGIN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      STORAGE_DIR: /app/storage
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - asclepius-assets-prod:/app/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - api

volumes:
  asclepius-postgres-prod:
  asclepius-assets-prod:
